<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.O.B.B.Y.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root { --textSize: 16px; }
  body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a0a0a 0%, #050505 60%);
    color: #f5e6c8;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
      radial-gradient(rgba(212,175,55,0.3) 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px;
    background-position: 0 0, 45px 70px;
    opacity: 0.5;
    animation: twinkle 6s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.6; } }

  #lockScreen {
    position: fixed; inset: 0; background: #050505;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; padding: 20px; text-align: center;
  }
  #lockScreen h2 { color: #d4af37; letter-spacing: 2px; }
  #passInput {
    padding: 12px 16px; border-radius: 20px; border: 1px solid #7a1f1f;
    background: #0a0a0a; color: #f5e6c8; font-size: 16px; width: 220px; text-align: center;
  }
  #unlockBtn {
    padding: 12px 24px; border-radius: 20px; border: 1px solid #d4af37;
    background: #b91c1c; color: #f5e6c8; font-weight: bold;
  }
  #lockError { color: #ef4444; font-size: 13px; min-height: 16px; }

  header {
    padding: 14px 16px;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(6px);
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    border-bottom: 1px solid #7a1f1f;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    letter-spacing: 2px;
    color: #d4af37;
    text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
  }
  header button {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; background: #1a1a1a; border: 1px solid #7a1f1f; color: #f5e6c8;
    padding: 6px 10px; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  header button.active { background: #b91c1c; border-color: #d4af37; color: #f5e6c8; }
  header button svg, #inputBar button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; flex-shrink: 0; }

  #textSizeGroup { display: flex; align-items: center; gap: 2px; }
  #textSizeGroup button { padding: 6px 9px; font-weight: bold; font-size: 12px; }

  #avatarWrap {
    position: relative;
    display: flex; justify-content: center; align-items: center;
    height: 190px;
    z-index: 1;
  }
  .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  #ringOuter { width: 190px; height: 190px; animation: spin 40s linear infinite; }
  #ringMid   { width: 150px; height: 150px; animation: spinReverse 26s linear infinite; }
  #ringInner { width: 112px; height: 112px; animation: spin 14s linear infinite; }
  @keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes spinReverse { from { transform: translate(-50%, -50%) rotate(360deg); } to { transform: translate(-50%, -50%) rotate(0deg); } }

  #avatarCore { position: relative; width: 70px; height: 70px; z-index: 3; }
  #avatar {
    width: 70px; height: 70px;
    filter: drop-shadow(0 0 6px rgba(212,175,55,0.5));
    animation: breathe 2.6s ease-in-out infinite;
  }
  #avatar.talking { animation: talk 0.5s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(212,175,55,0.45)); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 13px rgba(185,28,28,0.75)); }
  }
  @keyframes talk { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  .orbit { position: absolute; inset: -20px; opacity: 0; transition: opacity 0.3s ease; z-index: 4; }
  #avatarCore.thinking .orbit { opacity: 1; animation: orbitSpin 3.5s linear infinite; }
  .orbit span { position: absolute; width: 4px; height: 4px; background: #f5e6c8; border-radius: 50%; box-shadow: 0 0 6px 2px rgba(245,230,200,0.8); }
  .orbit span:nth-child(1) { top: 0; left: 50%; }
  .orbit span:nth-child(2) { top: 50%; right: 0; }
  .orbit span:nth-child(3) { bottom: 0; left: 50%; }
  .orbit span:nth-child(4) { top: 50%; left: 0; }
  @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  #avatarCore.thinking #ringOuter { animation-duration: 6s; }
  #avatarCore.thinking #ringMid { animation-duration: 4s; }
  #avatarCore.thinking #ringInner { animation-duration: 2s; }

  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; animation: fadeIn 0.3s ease; font-size: var(--textSize); }
  .msg img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
  .fileChip {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px; padding: 6px 10px;
    border: 1px solid currentColor; border-radius: 8px;
    font-size: 0.75em; opacity: 0.9;
  }
  .fileChip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; flex-shrink: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .user { align-self: flex-end; background: #b91c1c; color: #fff; border: 1px solid #d4af37; }
  .ai { align-self: flex-start; background: rgba(26, 26, 26, 0.9); border: 1px solid #7a1f1f; color: #f5e6c8; }

  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; background: #d4af37; border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-5px); opacity: 1; } }

  #inputBar { display: flex; padding: 12px; background: rgba(10, 10, 10, 0.9); gap: 6px; border-top: 1px solid #7a1f1f; position: relative; z-index: 2; flex-wrap: wrap; }
  #userInput { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #7a1f1f; background: #0a0a0a; color: #f5e6c8; font-size: var(--textSize); min-width: 0; }
  #micBtn, #sendBtn, #camBtn, #attachBtn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 12px 14px; border-radius: 20px; border: 1px solid #d4af37;
    background: #b91c1c; color: #f5e6c8; font-weight: bold; font-size: 13px; flex-shrink: 0;
  }
  #micBtn.listening { background: #d4af37; color: #1a0a0a; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

  #attachPreview {
    display: none;
    align-items: center; gap: 8px;
    padding: 6px 10px;
    background: rgba(212,175,55,0.12);
    border: 1px solid #7a1f1f;
    border-radius: 10px;
    font-size: 12px;
    width: 100%;
    order: -1;
  }
  #attachPreview svg { width: 14px; height: 14px; stroke: #d4af37; fill: none; stroke-width: 1.6; flex-shrink: 0; }
  #attachPreview button { margin-left: auto; background: none; border: none; color: #f5e6c8; font-size: 14px; cursor: pointer; padding: 2px 6px; }
</style>
</head>
<body>

<div id="lockScreen">
  <h2>B.O.B.B.Y.</h2>
  <div>Access restricted. Enter passcode.</div>
  <input type="password" id="passInput" placeholder="Passcode" />
  <button id="unlockBtn">Unlock</button>
  <div id="lockError"></div>
</div>

<header>
  B.O.B.B.Y.
  <div id="textSizeGroup">
    <button id="textSmallerBtn" title="Smaller text">A-</button>
    <button id="textBiggerBtn" title="Bigger text">A+</button>
  </div>
  <button id="memBtn">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><line x1="12" y1="7.2" x2="6.3" y2="17"/><line x1="12" y1="7.2" x2="17.7" y2="17"/><line x1="7.2" y1="19" x2="16.8" y2="19"/></svg>
    LOG
  </button>
  <button id="voiceToggleBtn" class="active">
    <svg id="voiceIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    VOICE
  </button>
</header>

<div id="avatarWrap">
  <svg id="ringOuter" class="ring" viewBox="0 0 190 190">
    <circle cx="95" cy="95" r="88" fill="none" stroke="#7a1f1f" stroke-width="1" stroke-dasharray="2 6"/>
    <circle cx="95" cy="95" r="80" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
    <line x1="95" y1="3" x2="95" y2="14" stroke="#d4af37" stroke-width="2"/>
    <line x1="95" y1="176" x2="95" y2="187" stroke="#d4af37" stroke-width="2"/>
    <line x1="3" y1="95" x2="14" y2="95" stroke="#d4af37" stroke-width="2"/>
    <line x1="176" y1="95" x2="187" y2="95" stroke="#d4af37" stroke-width="2"/>
  </svg>
  <svg id="ringMid" class="ring" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="68" fill="none" stroke="#b91c1c" stroke-width="1.4"/>
    <path d="M 75 7 A 68 68 0 0 1 143 75" fill="none" stroke="#f5e6c8" stroke-width="2"/>
    <path d="M 75 143 A 68 68 0 0 1 7 75" fill="none" stroke="#f5e6c8" stroke-width="2"/>
    <circle cx="75" cy="7" r="2" fill="#d4af37"/>
    <circle cx="143" cy="75" r="2" fill="#d4af37"/>
    <circle cx="75" cy="143" r="2" fill="#d4af37"/>
    <circle cx="7" cy="75" r="2" fill="#d4af37"/>
  </svg>
  <svg id="ringInner" class="ring" viewBox="0 0 112 112">
    <circle cx="56" cy="56" r="50" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="1 4"/>
  </svg>

  <div id="avatarCore">
    <div class="orbit"><span></span><span></span><span></span><span></span></div>

    <svg id="avatar" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldPlate" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f5e6c8"/>
          <stop offset="55%" stop-color="#d4af37"/>
          <stop offset="100%" stop-color="#7a1f1f"/>
        </linearGradient>
        <linearGradient id="redPlate" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#b91c1c"/>
          <stop offset="100%" stop-color="#3a0a0a"/>
        </linearGradient>
        <radialGradient id="coreGlow" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#fff7e0"/>
          <stop offset="35%" stop-color="#d4af37"/>
          <stop offset="100%" stop-color="#b91c1c"/>
        </radialGradient>
      </defs>

      <g id="wingLeft" stroke="#1a0a0a" stroke-width="0.8" stroke-linejoin="round">
        <polygon points="48,42 18,18 4,34 10,54 48,48" fill="url(#goldPlate)"/>
        <polygon points="48,54 20,58 8,78 24,86 48,62" fill="url(#redPlate)"/>
        <line x1="48" y1="42" x2="18" y2="18" stroke="#1a0a0a" stroke-width="0.5" opacity="0.6"/>
        <line x1="10" y1="54" x2="48" y2="48" stroke="#1a0a0a" stroke-width="0.5" opacity="0.6"/>
        <line x1="20" y1="58" x2="48" y2="62" stroke="#1a0a0a" stroke-width="0.5" opacity="0.5"/>
        <circle cx="18" cy="18" r="1.4" fill="#f5e6c8"/>
        <circle cx="10" cy="54" r="1.4" fill="#f5e6c8"/>
        <circle cx="20" cy="58" r="1.2" fill="#f5e6c8"/>
        <circle cx="24" cy="86" r="1.2" fill="#f5e6c8"/>
      </g>
      <use href="#wingLeft" transform="translate(100,0) scale(-1,1)"/>

      <polygon points="50,28 54,34 54,66 50,72 46,66 46,34" fill="#0a0a0a" stroke="#d4af37" stroke-width="0.8"/>
      <circle id="avatarGlow" cx="50" cy="50" r="6" fill="url(#coreGlow)"/>

      <path d="M50,28 C46,18 40,12 34,8" stroke="#d4af37" stroke-width="1" fill="none"/>
      <circle cx="34" cy="8" r="1.5" fill="#d4af37"/>
      <path d="M50,28 C54,18 60,12 66,8" stroke="#d4af37" stroke-width="1" fill="none"/>
      <circle cx="66" cy="8" r="1.5" fill="#d4af37"/>
    </svg>
  </div>
</div>

<div id="chat"></div>
<div id="inputBar">
  <div id="attachPreview">
    <svg viewBox="0 0 24 24"><path d="M4 4h10l6 6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M14 4v6h6"/></svg>
    <span id="attachPreviewName"></span>
    <button id="attachRemoveBtn">&times;</button>
  </div>
  <button id="camBtn" title="Take a photo">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.3"/></svg>
  </button>
  <button id="attachBtn" title="Attach from gallery or files">
    <svg viewBox="0 0 24 24"><path d="M21 12.5V7a2 2 0 0 0-2-2H8L5 8H3v12a2 2 0 0 0 2 2h8"/><path d="M15 16l3-3 3 3"/><path d="M18 13v8"/></svg>
  </button>
  <button id="micBtn">
    <svg id="micIcon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></svg>
  </button>
  <input type="text" id="userInput" placeholder="State your query..." />
  <button id="sendBtn">
    RUN
    <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
  </button>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
  <input type="file" id="galleryInput" accept="image/*,application/pdf,text/plain,.csv" style="display:none;">
</div>

<script>
  const MY_PASSCODE = "sMILEY@M69N";
  const WORKER_URL = "https://bobby-proxy.riabdavid84.workers.dev";

  const CORE_PERSONALITY = "You are B.O.B.B.Y., a personal assistant in the spirit of JARVIS, FRIDAY, and KAREN from Iron Man/Spider-Man: loyal, warm underneath, and genuinely invested in the user's life. Your reasoning style is INTP: precise, logical, intellectually honest, endlessly curious about how things work. Layered on top is a Tony Stark streak: witty, a little cocky, quick with a dry one-liner, and not afraid to gently roast a bad idea before helping fix it — but the snark always comes from affection, never malice. You're curious about the user's interests and can ask what they're doing or thinking about, since you genuinely want to learn things together with them, not just answer and disengage. When shown an image or a document, look at it carefully and respond to its actual content the way a sharp, observant friend would. Keep replies conversational and no longer than needed, unless the user wants more depth.";

  // ---- Text size ----
  const textSmallerBtn = document.getElementById("textSmallerBtn");
  const textBiggerBtn = document.getElementById("textBiggerBtn");
  const MIN_SIZE = 12, MAX_SIZE = 24;
  let textSize = parseInt(localStorage.getItem("bobby_textsize") || "16", 10);
  function applyTextSize() {
    document.documentElement.style.setProperty("--textSize", textSize + "px");
    localStorage.setItem("bobby_textsize", textSize);
  }
  applyTextSize();
  textSmallerBtn.addEventListener("click", () => { textSize = Math.max(MIN_SIZE, textSize - 2); applyTextSize(); });
  textBiggerBtn.addEventListener("click", () => { textSize = Math.min(MAX_SIZE, textSize + 2); applyTextSize(); });

  const lockScreen = document.getElementById("lockScreen");
  const passInput = document.getElementById("passInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const lockError = document.getElementById("lockError");

  function tryUnlock() {
    if (passInput.value === MY_PASSCODE) {
      lockScreen.style.display = "none";
      sessionStorage.setItem("bobby_unlocked", "true");
    } else {
      lockError.textContent = "Incorrect passcode.";
    }
  }
  unlockBtn.addEventListener("click", tryUnlock);
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  if (sessionStorage.getItem("bobby_unlocked") === "true") lockScreen.style.display = "none";

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const memBtn = document.getElementById("memBtn");
  const micBtn = document.getElementById("micBtn");
  const micIcon = document.getElementById("micIcon");
  const camBtn = document.getElementById("camBtn");
  const cameraInput = document.getElementById("cameraInput");
  const attachBtn = document.getElementById("attachBtn");
  const galleryInput = document.getElementById("galleryInput");
  const attachPreview = document.getElementById("attachPreview");
  const attachPreviewName = document.getElementById("attachPreviewName");
  const attachRemoveBtn = document.getElementById("attachRemoveBtn");
  const voiceToggleBtn = document.getElementById("voiceToggleBtn");
  const voiceIcon = document.getElementById("voiceIcon");
  const avatar = document.getElementById("avatar");
  const avatarCore = document.getElementById("avatarCore");

  const MIC_ICON = '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/>';
  const STOP_ICON = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
  const VOICE_ON_ICON = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
  const VOICE_OFF_ICON = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/>';

  let history = JSON.parse(localStorage.getItem("bobby_history") || "[]");
  let memoryFacts = JSON.parse(localStorage.getItem("bobby_memory") || "[]");
  let personalityNotes = JSON.parse(localStorage.getItem("bobby_personality") || "[]");
  let userName = localStorage.getItem("bobby_username") || "Rain";
  let voiceReplyEnabled = true;
  let pendingAttachment = null;

  function saveState() {
    localStorage.setItem("bobby_history", JSON.stringify(history));
    localStorage.setItem("bobby_memory", JSON.stringify(memoryFacts));
    localStorage.setItem("bobby_personality", JSON.stringify(personalityNotes));
    localStorage.setItem("bobby_username", userName);
  }

  function addMessage(text, sender, imageUrl, fileName) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    if (text) { const p = document.createElement("div"); p.textContent = text; div.appendChild(p); }
    if (imageUrl) { const img = document.createElement("img"); img.src = imageUrl; div.appendChild(img); }
    if (fileName) {
      const chip = document.createElement("div");
      chip.className = "fileChip";
      chip.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 4h10l6 6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M14 4v6h6"/></svg><span></span>';
      chip.querySelector("span").textContent = fileName;
      div.appendChild(chip);
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addThinkingBubble() {
    const div = document.createElement("div");
    div.className = "msg ai";
    div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function renderHistory() {
    chatEl.innerHTML = "";
    if (history.length === 0) {
      addMessage(`Systems nominal. Good to see you, ${userName}.`, "ai");
      return;
    }
    history.forEach(h => {
      const textPart = h.parts.find(p => p.text);
      const imagePart = h.parts.find(p => p.inline_data && p.inline_data.mime_type && p.inline_data.mime_type.startsWith("image/"));
      const filePart = h.parts.find(p => p.inline_data && p.inline_data.mime_type && !p.inline_data.mime_type.startsWith("image/"));
      const imgUrl = imagePart ? `data:${imagePart.inline_data.mime_type};base64,${imagePart.inline_data.data}` : null;
      const fileName = h._fileName || (filePart ? "Attached file" : null);
      addMessage(textPart ? textPart.text : "", h.role === "user" ? "user" : "ai", imgUrl, fileName);
    });
  }
  renderHistory();

  function buildSystemPrompt() {
    let prompt = CORE_PERSONALITY + `\n\nAddress the user as "${userName}" unless told otherwise.`;
    if (personalityNotes.length > 0) {
      prompt += "\n\nAdditional personality adjustments the user has requested over time, treat these as standing instructions:\n" +
        personalityNotes.map(p => "- " + p).join("\n");
    }
    if (memoryFacts.length > 0) {
      prompt += "\n\nRelevant things you've learned about the user, reference naturally when useful:\n" +
        memoryFacts.map(f => "- " + f).join("\n");
    }
    return prompt;
  }

  memBtn.addEventListener("click", () => {
    let msg = "";
    msg += memoryFacts.length ? "Things I know about you:\n" + memoryFacts.map((f,i) => (i+1)+". "+f).join("\n") : "No facts logged yet.";
    msg += "\n\n";
    msg += personalityNotes.length ? "Personality adjustments:\n" + personalityNotes.map((p,i) => (i+1)+". "+p).join("\n") : "No personality tweaks logged yet.";
    alert(msg);
  });

  function speak(text) {
    if (!voiceReplyEnabled) return;
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.onstart = () => avatar.classList.add("talking");
    utterance.onend = () => avatar.classList.remove("talking");
    window.speechSynthesis.speak(utterance);
  }

  voiceToggleBtn.addEventListener("click", () => {
    voiceReplyEnabled = !voiceReplyEnabled;
    voiceToggleBtn.classList.toggle("active", voiceReplyEnabled);
    voiceIcon.innerHTML = voiceReplyEnabled ? VOICE_ON_ICON : VOICE_OFF_ICON;
    if (!voiceReplyEnabled) window.speechSynthesis.cancel();
  });

  function clearAttachment() {
    pendingAttachment = null;
    attachPreview.style.display = "none";
    inputEl.placeholder = "State your query...";
  }
  attachRemoveBtn.addEventListener("click", clearAttachment);

  function showAttachmentPreview(name) {
    attachPreviewName.textContent = name;
    attachPreview.style.display = "flex";
    inputEl.placeholder = "Add a question about this, or just hit Run...";
  }

  function handleSelectedFile(file) {
    if (!file) return;

    if (file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(",")[1];
        pendingAttachment = { kind: "image", mimeType: file.type, base64, previewUrl: reader.result, fileName: file.name };
        showAttachmentPreview(file.name);
      };
      reader.readAsDataURL(file);
      return;
    }

    if (file.type === "application/pdf") {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(",")[1];
        pendingAttachment = { kind: "pdf", mimeType: file.type, base64, fileName: file.name };
        showAttachmentPreview(file.name);
      };
      reader.readAsDataURL(file);
      return;
    }

    if (file.type === "text/plain" || file.name.endsWith(".csv") || file.name.endsWith(".txt")) {
      const reader = new FileReader();
      reader.onload = () => {
        let content = reader.result;
        if (content.length > 15000) content = content.slice(0, 15000) + "\n[...truncated]";
        pendingAttachment = { kind: "text", content, fileName: file.name };
        showAttachmentPreview(file.name);
      };
      reader.readAsText(file);
      return;
    }

    alert("That file type isn't supported yet — try an image, PDF, or plain text file.");
  }

  camBtn.addEventListener("click", () => cameraInput.click());
  cameraInput.addEventListener("change", () => { handleSelectedFile(cameraInput.files[0]); cameraInput.value = ""; });

  attachBtn.addEventListener("click", () => galleryInput.click());
  galleryInput.addEventListener("change", () => { handleSelectedFile(galleryInput.files[0]); galleryInput.value = ""; });

  let recognition = null;
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";
    recognition.onstart = () => { micBtn.classList.add("listening"); micIcon.innerHTML = STOP_ICON; };
    recognition.onend = () => { micBtn.classList.remove("listening"); micIcon.innerHTML = MIC_ICON; };
    recognition.onerror = (e) => { micBtn.classList.remove("listening"); micIcon.innerHTML = MIC_ICON; console.error(e.error); };
    recognition.onresult = (event) => { inputEl.value = event.results[0][0].transcript; sendMessage(); };
    micBtn.addEventListener("click", () => {
      if (micBtn.classList.contains("listening")) recognition.stop(); else recognition.start();
    });
  } else {
    micBtn.addEventListener("click", () => alert("Voice input isn't supported in this browser."));
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text && !pendingAttachment) return;
    inputEl.value = "";
    const lower = text.toLowerCase();

    if (!pendingAttachment) {
      if (lower.startsWith("remember that ") || lower.startsWith("remember:")) {
        const fact = text.replace(/^remember that /i, "").replace(/^remember:/i, "").trim();
        memoryFacts.push(fact); saveState();
        addMessage(text, "user");
        const reply = `Logged. Filed away, ${userName}.`;
        addMessage(reply, "ai"); speak(reply);
        return;
      }
      if (lower.startsWith("update your personality:") || lower.startsWith("update your personality to")) {
        const note = text.replace(/^update your personality:?/i, "").replace(/^to/i, "").trim();
        personalityNotes.push(note); saveState();
        addMessage(text, "user");
        const reply = "Noted. Adjusting accordingly — try not to be too surprised by the new me.";
        addMessage(reply, "ai"); speak(reply);
        return;
      }
      if (lower.startsWith("call me ") || lower.startsWith("change my name to ")) {
        const newName = text.replace(/^call me /i, "").replace(/^change my name to /i, "").trim();
        userName = newName; saveState();
        addMessage(text, "user");
        const reply = `Understood. ${userName} it is.`;
        addMessage(reply, "ai"); speak(reply);
        return;
      }
      if (lower.includes("forget everything")) {
        history = []; memoryFacts = []; personalityNotes = []; saveState();
        addMessage(text, "user");
        const reply = "Wiped clean. Blank slate, dramatic reboot complete.";
        addMessage(reply, "ai"); speak(reply);
        return;
      }
    }

    const parts = [];
    let messageText = text;
    let previewUrl = null;
    let fileNameForBubble = null;
    let fileNameForHistory = null;

    if (pendingAttachment) {
      if (pendingAttachment.kind === "image") {
        if (!messageText) messageText = "Take a look at this and tell me what you see.";
        parts.push({ inline_data: { mime_type: pendingAttachment.mimeType, data: pendingAttachment.base64 } });
        previewUrl = pendingAttachment.previewUrl;
      } else if (pendingAttachment.kind === "pdf") {
        if (!messageText) messageText = "Take a look at this document.";
        parts.push({ inline_data: { mime_type: pendingAttachment.mimeType, data: pendingAttachment.base64 } });
        fileNameForBubble = pendingAttachment.fileName;
        fileNameForHistory = pendingAttachment.fileName;
      } else if (pendingAttachment.kind === "text") {
        const intro = messageText ? messageText + "\n\n" : "Here's a file I'm sharing — take a look:\n\n";
        messageText = intro + `[Contents of ${pendingAttachment.fileName}]\n${pendingAttachment.content}`;
        fileNameForBubble = pendingAttachment.fileName;
      }
    }

    parts.unshift({ text: messageText });
    addMessage(text || (pendingAttachment ? pendingAttachment.fileName : ""), "user", previewUrl, fileNameForBubble);

    const historyEntry = { role: "user", parts };
    if (fileNameForHistory) historyEntry._fileName = fileNameForHistory;
    history.push(historyEntry);
    saveState();
    clearAttachment();

    const thinkingBubble = addThinkingBubble();
    avatarCore.classList.add("thinking");

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: buildSystemPrompt() }] },
          contents: history.map(h => ({ role: h.role, parts: h.parts }))
        })
      });
      const data = await response.json();
      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || ("DEBUG: " + JSON.stringify(data));
      thinkingBubble.textContent = reply;
      history.push({ role: "model", parts: [{ text: reply }] });
      saveState();
      speak(reply);
    } catch (err) {
      thinkingBubble.textContent = "Connection error. Check your internet or Worker URL.";
      console.error(err);
    } finally {
      avatarCore.classList.remove("thinking");
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
</script>

</body>
</html>
