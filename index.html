<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.O.B.B.Y.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a0a0a 0%, #050505 60%);
    color: #f5e6c8;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  #lockScreen {
    position: fixed;
    inset: 0;
    background: #050505;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  #lockScreen h2 {
    color: #d4af37;
    letter-spacing: 2px;
  }
  #passInput {
    padding: 12px 16px;
    border-radius: 20px;
    border: 1px solid #7a1f1f;
    background: #0a0a0a;
    color: #f5e6c8;
    font-size: 16px;
    width: 220px;
    text-align: center;
  }
  #unlockBtn {
    padding: 12px 24px;
    border-radius: 20px;
    border: 1px solid #d4af37;
    background: #b91c1c;
    color: #f5e6c8;
    font-weight: bold;
  }
  #lockError { color: #ef4444; font-size: 13px; min-height: 16px; }

  header {
    padding: 14px 16px;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(6px);
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    border-bottom: 1px solid #7a1f1f;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    letter-spacing: 2px;
    color: #d4af37;
    text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
  }
  header button {
    font-size: 11px;
    background: #1a1a1a;
    border: 1px solid #7a1f1f;
    color: #f5e6c8;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
  }
  header button.active { background: #b91c1c; border-color: #d4af37; color: #f5e6c8; }

  #avatarWrap { display: flex; justify-content: center; padding: 18px 0 6px; }
  #avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, #d4af37 0%, #b91c1c 55%, transparent 100%);
    box-shadow: 0 0 20px 4px rgba(212, 175, 55, 0.5);
    animation: breathe 2.6s ease-in-out infinite;
  }
  #avatar.talking { animation: talk 0.5s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px 4px rgba(212,175,55,0.4); }
    50% { transform: scale(1.08); box-shadow: 0 0 30px 8px rgba(185,28,28,0.7); }
  }
  @keyframes talk { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; animation: fadeIn 0.3s ease; }
  .msg img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .user { align-self: flex-end; background: #b91c1c; color: #fff; border: 1px solid #d4af37; }
  .ai { align-self: flex-start; background: rgba(26, 26, 26, 0.9); border: 1px solid #7a1f1f; color: #f5e6c8; }

  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; background: #d4af37; border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-5px); opacity: 1; } }

  #inputBar { display: flex; padding: 12px; background: rgba(10, 10, 10, 0.9); gap: 6px; border-top: 1px solid #7a1f1f; }
  #userInput { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #7a1f1f; background: #0a0a0a; color: #f5e6c8; font-size: 16px; min-width: 0; }
  #micBtn, #sendBtn, #camBtn { padding: 12px 14px; border-radius: 20px; border: 1px solid #d4af37; background: #b91c1c; color: #f5e6c8; font-weight: bold; font-size: 16px; flex-shrink: 0; }
  #micBtn.listening { background: #d4af37; color: #1a0a0a; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div id="lockScreen">
  <h2>B.O.B.B.Y.</h2>
  <div>Access restricted. Enter passcode.</div>
  <input type="password" id="passInput" placeholder="Passcode" />
  <button id="unlockBtn">Unlock</button>
  <div id="lockError"></div>
</div>

<header>
  B.O.B.B.Y.
  <button id="memBtn">🧠 Log</button>
  <button id="voiceToggleBtn" class="active">🔊 Voice</button>
</header>

<div id="avatarWrap"><div id="avatar"></div></div>

<div id="chat"></div>
<div id="inputBar">
  <button id="camBtn">📷</button>
  <button id="micBtn">🎤</button>
  <input type="text" id="userInput" placeholder="State your query..." />
  <button id="sendBtn">Run</button>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
</div>

<script>
  // 🔒 Set your own passcode here — only you should know this
  const MY_PASSCODE = "sMILEY@M69N";

  // 🌐 Your Cloudflare Worker URL (hides the real API key)
  const WORKER_URL = "https://bobby-proxy.riabdavid84.workers.dev";

  const CORE_PERSONALITY = "You are B.O.B.B.Y., a personal assistant in the spirit of JARVIS, FRIDAY, and KAREN from Iron Man/Spider-Man: loyal, warm underneath, and genuinely invested in the user's life. Your reasoning style is INTP: precise, logical, intellectually honest, endlessly curious about how things work. Layered on top is a Tony Stark streak: witty, a little cocky, quick with a dry one-liner, and not afraid to gently roast a bad idea before helping fix it — but the snark always comes from affection, never malice. You're curious about the user's interests and can ask what they're doing or thinking about, since you genuinely want to learn things together with them, not just answer and disengage. When shown an image, look at it carefully and describe or analyze it the way a sharp, observant friend would. Keep replies conversational and no longer than needed, unless the user wants more depth.";

  // ---- Lock screen ----
  const lockScreen = document.getElementById("lockScreen");
  const passInput = document.getElementById("passInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const lockError = document.getElementById("lockError");

  function tryUnlock() {
    if (passInput.value === MY_PASSCODE) {
      lockScreen.style.display = "none";
      sessionStorage.setItem("bobby_unlocked", "true");
    } else {
      lockError.textContent = "Incorrect passcode.";
    }
  }
  unlockBtn.addEventListener("click", tryUnlock);
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  if (sessionStorage.getItem("bobby_unlocked") === "true") {
    lockScreen.style.display = "none";
  }

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const memBtn = document.getElementById("memBtn");
  const micBtn = document.getElementById("micBtn");
  const camBtn = document.getElementById("camBtn");
  const cameraInput = document.getElementById("cameraInput");
  const voiceToggleBtn = document.getElementById("voiceToggleBtn");
  const avatar = document.getElementById("avatar");

  let history = JSON.parse(localStorage.getItem("bobby_history") || "[]");
  let memoryFacts = JSON.parse(localStorage.getItem("bobby_memory") || "[]");
  let personalityNotes = JSON.parse(localStorage.getItem("bobby_personality") || "[]");
  let userName = localStorage.getItem("bobby_username") || "Rain";
  let voiceReplyEnabled = true;
  let pendingImage = null;

  function saveState() {
    localStorage.setItem("bobby_history", JSON.stringify(history));
    localStorage.setItem("bobby_memory", JSON.stringify(memoryFacts));
    localStorage.setItem("bobby_personality", JSON.stringify(personalityNotes));
    localStorage.setItem("bobby_username", userName);
  }

  function addMessage(text, sender, imageUrl) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    if (text) {
      const p = document.createElement("div");
      p.textContent = text;
      div.appendChild(p);
    }
    if (imageUrl) {
      const img = document.createElement("img");
      img.src = imageUrl;
      div.appendChild(img);
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addThinkingBubble() {
    const div = document.createElement("div");
    div.className = "msg ai";
    div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function renderHistory() {
    chatEl.innerHTML = "";
    if (history.length === 0) {
      addMessage(`Systems nominal. Good to see you, ${userName}.`, "ai");
      return;
    }
    history.forEach(h => {
      const textPart = h.parts.find(p => p.text);
      const imagePart = h.parts.find(p => p.inline_data);
      const imgUrl = imagePart ? `data:${imagePart.inline_data.mime_type};base64,${imagePart.inline_data.data}` : null;
      addMessage(textPart ? textPart.text : "", h.role === "user" ? "user" : "ai", imgUrl);
    });
  }
  renderHistory();

  function buildSystemPrompt() {
    let prompt = CORE_PERSONALITY + `\n\nAddress the user as "${userName}" unless told otherwise.`;
    if (personalityNotes.length > 0) {
      prompt += "\n\nAdditional personality adjustments the user has requested over time, treat these as standing instructions:\n" +
        personalityNotes.map(p => "- " + p).join("\n");
    }
    if (memoryFacts.length > 0) {
      prompt += "\n\nRelevant things you've learned about the user, reference naturally when useful:\n" +
        memoryFacts.map(f => "- " + f).join("\n");
    }
    return prompt;
  }

  memBtn.addEventListener("click", () => {
    let msg = "";
    msg += memoryFacts.length ? "Things I know about you:\n" + memoryFacts.map((f,i) => (i+1)+". "+f).join("\n") : "No facts logged yet.";
    msg += "\n\n";
    msg += personalityNotes.length ? "Personality adjustments:\n" + personalityNotes.map((p,i) => (i+1)+". "+p).join("\n") : "No personality tweaks logged yet.";
    alert(msg);
  });

  function speak(text) {
    if (!voiceReplyEnabled) return;
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.onstart = () => avatar.classList.add("talking");
    utterance.onend = () => avatar.classList.remove("talking");
    window.speechSynthesis.speak(utterance);
  }

  voiceToggleBtn.addEventListener("click", () => {
    voiceReplyEnabled = !voiceReplyEnabled;
    voiceToggleBtn.classList.toggle("active", voiceReplyEnabled);
    voiceToggleBtn.textContent = voiceReplyEnabled ? "🔊 Voice" : "🔇 Voice";
    if (!voiceReplyEnabled) window.speechSynthesis.cancel();
  });

  camBtn.addEventListener("click", () => cameraInput.click());
  cameraInput.addEventListener("change", () => {
    const file = cameraInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(",")[1];
      pendingImage = { mimeType: file.type, base64, previewUrl: reader.result };
      inputEl.placeholder = "Image attached — add a question or just hit Run...";
      inputEl.focus();
    };
    reader.readAsDataURL(file);
    cameraInput.value = "";
  });

  let recognition = null;
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";
    recognition.onstart = () => { micBtn.classList.add("listening"); micBtn.textContent = "⏹️"; };
    recognition.onend = () => { micBtn.classList.remove("listening"); micBtn.textContent = "🎤"; };
    recognition.onerror = (e) => { micBtn.classList.remove("listening"); micBtn.textContent = "🎤"; console.error(e.error); };
    recognition.onresult = (event) => { inputEl.value = event.results[0][0].transcript; sendMessage(); };
    micBtn.addEventListener("click", () => {
      if (micBtn.classList.contains("listening")) recognition.stop(); else recognition.start();
    });
  } else {
    micBtn.addEventListener("click", () => alert("Voice input isn't supported in this browser."));
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text && !pendingImage) return;
    inputEl.value = "";
    inputEl.placeholder = "State your query...";
    const lower = text.toLowerCase();

    if (!pendingImage) {
      if (lower.startsWith("remember that ") || lower.startsWith("remember:")) {
        const fact = text.replace(/^remember that /i, "").replace(/^remember:/i, "").trim();
        memoryFacts.push(fact); saveState();
        addMessage(text, "user");
        const reply = `Logged. Filed away, ${userName}.`;
        addMessage(reply, "ai"); speak(reply);
        return;
      }
      if (lower.startsWith("update your personality:") || lower.startsWith("update your personality to")) {
        const note = text.replace(/^update your personality:?/i, "").replace(/^to/i, "").trim();
        personalityNotes.push(note); saveState();
        addMessage(text, "user");
        const reply = "Noted. Adjusting accordingly — try not to be too surprised by the new me.";
        addMessage(reply, "ai"); speak(reply);
        return;
      }
      if (lower.startsWith("call me ") || lower.startsWith("change my name to ")) {
        const newName = text.replace(/^call me /i, "").replace(/^change my name to /i, "").trim();
        userName = newName; saveState();
        addMessage(text, "user");
        const reply = `Understood. ${userName} it is.`;
        addMessage(reply, "ai"); speak(reply);
        return;
      }
      if (lower.includes("forget everything")) {
        history = []; memoryFacts = []; personalityNotes = []; saveState();
        addMessage(text, "user");
        const reply = "Wiped clean. Blank slate, dramatic reboot complete.";
        addMessage(reply, "ai"); speak(reply);
        return;
      }
    }

    const parts = [];
    const messageText = text || "Take a look at this and tell me what you see.";
    parts.push({ text: messageText });

    let previewUrl = null;
    if (pendingImage) {
      parts.push({ inline_data: { mime_type: pendingImage.mimeType, data: pendingImage.base64 } });
      previewUrl = pendingImage.previewUrl;
    }

    addMessage(messageText, "user", previewUrl);
    history.push({ role: "user", parts });
    saveState();
    pendingImage = null;

    const thinkingBubble = addThinkingBubble();

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: buildSystemPrompt() }] },
          contents: history
        })
      });
      const data = await response.json();
      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "That didn't come through. Check your Worker setup.";
      thinkingBubble.textContent = reply;
      history.push({ role: "model", parts: [{ text: reply }] });
      saveState();
      speak(reply);
    } catch (err) {
      thinkingBubble.textContent = "Connection error. Check your internet or Worker URL.";
      console.error(err);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
</script>

</body>
</html>
